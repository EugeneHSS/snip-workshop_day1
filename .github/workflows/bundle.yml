name: Build bundle

on:
  # Source branches have independent trees without this workflow; a push there
  # cannot run the workflow stored only on main.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snip-bundle-main
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.release.outputs.changed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - name: Configure bot identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Assemble, verify and push Git release
        id: release
        shell: bash
        run: |
          before=$(git rev-parse HEAD)
          node scripts/build-bundle.mjs --push
          node scripts/verify-release.mjs
          after=$(git rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  dispatch-image-checks:
    needs: assemble
    if: needs.assemble.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # GITHUB_TOKEN pushes do not trigger another push workflow. Dispatch is
      # explicit and supported; the image workflow still enforces every gate.
      - name: Dispatch image checks for main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/docker.yml/dispatches" \
            -d '{"ref":"main"}'
