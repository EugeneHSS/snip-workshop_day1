name: Build and push image

on:
  push:
    branches: [main]
    # bundle is a gitlink (exactly this path), not a directory glob.
    paths: [bundle, .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snip-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - run: node scripts/verify-release.mjs
      - run: node --test cli/cli.test.js
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm test -- --watch=false --browsers=ChromeHeadless
        working-directory: frontend
      - run: node scripts/smoke-test.mjs

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Block critical and high dependency advisories
        working-directory: frontend
        run: npm audit --package-lock-only --audit-level=high

  image-security:
    needs: [verify, dependency-security]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: node scripts/verify-release.mjs
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build candidate without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./bundle
          file: ./bundle/Dockerfile
          load: true
          push: false
          tags: snip-candidate:${{ github.sha }}
      - name: Smoke-test the candidate
        env:
          IMAGE: snip-candidate:${{ github.sha }}
        shell: bash
        run: |
          docker run -d --name snip-smoke -p 127.0.0.1:3000:3000 \
            -e BASE_URL=http://127.0.0.1:3000 "$IMAGE"
          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/links > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          node scripts/smoke-test.mjs --url http://127.0.0.1:3000
          test "$(docker inspect --format '{{.Config.User}}' snip-smoke)" = bun
      - name: Candidate logs and cleanup
        if: always()
        run: |
          if docker inspect snip-smoke > /dev/null 2>&1; then
            docker logs snip-smoke
            docker rm -f snip-smoke
          fi
      - name: Block critical and high image advisories
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.76.2
          image-ref: snip-candidate:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
          trivyignores: ""
      - name: Export the exact scanned image
        if: ${{ success() && needs.verify.result == 'success' && needs.dependency-security.result == 'success' }}
        run: docker save snip-candidate:${{ github.sha }} -o "${{ runner.temp }}/snip-image.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ success() && needs.verify.result == 'success' && needs.dependency-security.result == 'success' }}
        with:
          name: verified-image-${{ github.sha }}
          path: ${{ runner.temp }}/snip-image.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [verify, dependency-security, image-security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-image-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Image name
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: metadata
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the scanned image without rebuilding
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        shell: bash
        run: |
          docker load -i "${{ runner.temp }}/snip-image.tar"
          while IFS= read -r tag; do
            docker tag "snip-candidate:$GITHUB_SHA" "$tag"
            docker push "$tag"
          done <<< "$TAGS"
